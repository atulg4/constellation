name: Automatic planning

on:
  issues:
    types: [labeled, unlabeled, edited, closed]

permissions: {}

# Codex 4240628982: authorization is read when the run starts, so REMOVING an approval label must
# stop a run that is already queued or running: otherwise a Triage user could remove a label and
# re-apply it while a writer-authorized run waits for a runner, and that run would proceed. Every
# `labeled` event of a triggering label and every `unlabeled` event of a required label share one
# group per issue; an `unlabeled` run cancels what is in it (and itself starts nothing: its label
# is gone, so the label condition is false), while `labeled` runs queue as before. Any later run
# re-authorizes from the label history. Other label events (the lease's `in-progress` label among
# them) get a group of their own, so they never cancel the work. Codex 4241196649: an approval
# covers the title and body it saw, so an `edited` event joins the group and cancels too (and
# starts nothing itself); a later run is authorized only once the labels are re-applied after
# the edit. Codex 4242925431: closing the issue withdraws the request, so a `closed` event joins
# the group and cancels too (a closed issue's labels stay on it, but `preflight` runs only on
# `labeled`, so the `closed` run itself starts nothing).
concurrency:
  group: >-
    ${{ ((github.event.action == 'labeled' && (github.event.label.name == 'claude-ready' || github.event.label.name == 'human-review-required')) ||
    (github.event.action == 'unlabeled' && (github.event.label.name == 'claude-ready' || github.event.label.name == 'human-review-required')) ||
    github.event.action == 'edited' ||
    github.event.action == 'closed') &&
    format('forge-auto-plan-{0}', github.event.issue.number) ||
    format('forge-auto-plan-{0}-run-{1}',
    github.event.issue.number, github.run_id) }}
  cancel-in-progress: >-
    ${{ github.event.action == 'unlabeled' || github.event.action == 'edited' ||
    github.event.action == 'closed' }}

jobs:
  # Anyone may open the work-request issue template, which applies the planning labels itself.
  # The labeler's write authority is therefore checked HERE, on a GitHub-hosted runner, before
  # any job is scheduled on RUNS_ON: an outsider's issue must not occupy a self-hosted runner
  # (the reusable workflow checks again; this check only keeps unauthorized runs off it).
  # Not tunable: doctor requires this job, its runner and the `plan` gate exactly as generated.
  preflight:
    # Either planning label triggers (Codex 4241196642: re-adding a removed label must restart
    # the planning its removal cancelled); both must be on the issue. An issue opened with both
    # labels fires one `labeled` run per label: the shared concurrency group runs them one after
    # the other, and `dedupe` skips the later one once a plan covers the approval.
    if: >-
      github.event.action == 'labeled' &&
      (github.event.label.name == 'claude-ready' ||
       github.event.label.name == 'human-review-required') &&
      github.event.issue.pull_request == null &&
      contains(github.event.issue.labels.*.name, 'claude-ready') &&
      contains(github.event.issue.labels.*.name, 'human-review-required') &&
      !contains(github.event.issue.labels.*.name, 'implementation-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Codex 4240028941: naming any permission sets the rest to none, and listing the issue's
    # label events needs `issues: read` in a private repository (the collaborator-permission
    # reads need only the implicit metadata scope). Nothing broader.
    permissions:
      contents: read
      issues: read
    outputs:
      authorized: ${{ steps.authorize.outputs.authorized }}
      approver: ${{ steps.authorize.outputs.approver }}
      approved_at: ${{ steps.authorize.outputs.approved_at }}
      approved_latest_at: ${{ steps.authorize.outputs.approved_latest_at }}
    steps:
      - name: Require repository write authority from the labeler and the approver
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
          SENDER: ${{ github.event.sender.login }}
          ACTOR: ${{ github.actor }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          APPROVAL_LABEL: "claude-ready"
          REQUIRED_LABELS: "[\"claude-ready\",\"human-review-required\"]"
        run: |
          set -euo pipefail
          # Only a DEFINITIVE answer decides: HTTP 200 with a permission field, or 404 (not a
          # collaborator). Anything else (rate limit, 5xx, network) is retried, then FAILS the
          # job: never read as "unauthorized", which would silently consume the label event.
          authorized=true
          errors="$(mktemp)"
          # Codex 4239965189: the event's sender is not necessarily who APPROVED. A Triage user can
          # apply the approval label first and a writer the last prerequisite label later; so the
          # label events are read (every page) and whoever applied APPROVAL_LABEL most recently
          # must ALSO hold write authority. Codex 4240421144: and so must whoever applied EACH
          # label of the set (REQUIRED_LABELS, a JSON list) most recently -- the same rule as
          # `sdlcctl authorize-labeler`. History that cannot be read, or that never shows a label
          # applied, FAILS the job; a label removed since it was last applied is unauthorized.
          # Codex 4241196649: the approval is bound to the content it saw -- the title (its
          # `renamed` events) and the body (GraphQL lastEditedAt / userContentEdits) must have been
          # last edited BEFORE the latest application of EACH label; an issue edited since is
          # unauthorized until the labels are re-applied, and an edit time that cannot be read
          # FAILS the job. (An `edited` event also cancels a queued or running run: concurrency.)
          approver=""
          labelers=""
          removed=false
          renamed=""
          for attempt in 1 2 3; do
            removed=false
            approver=""
            labelers=""
            renamed=""
            if events="$(gh api --method GET --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/events?per_page=100" \
              --jq '.[] | select(.event == "labeled" or .event == "unlabeled" or .event == "renamed")
                | {event, name: .label.name, login: .actor.login, at: .created_at}' 2>"$errors")" &&
              latest="$(jq -sc --argjson labels "$REQUIRED_LABELS" '
                [.[] | select(.event != "renamed")] as $events
                | if any($events[]; (.name | type) != "string")
                then error("a label event names no label")
                else [$labels[] as $label
                  | ([$events[] | select((.name | ascii_downcase) == ($label | ascii_downcase))]
                    | last) // {event: "none", name: $label}]
                end' <<<"$events" 2>"$errors")" &&
              renamed="$(jq -sr '[.[] | select(.event == "renamed") | .at | fromdateiso8601]
                | max // 0' <<<"$events" 2>"$errors")"; then
              if jq -e 'any(.[]; .event == "unlabeled")' <<<"$latest" >/dev/null; then
                removed=true
                printf '::warning::attempt %s: an approval label was removed after it was last applied\n' \
                  "$attempt"
              elif jq -e 'any(.[]; .event != "labeled")' <<<"$latest" >/dev/null; then
                printf '::warning::attempt %s: no labeled event for every approval label yet\n' \
                  "$attempt"
              else
                labelers="$(jq -r '.[] | .login | if type == "string" then . else "" end' \
                  <<<"$latest")"
                valid=true
                while IFS= read -r login; do
                  if ! [[ "$login" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(\[bot\])?$ ]]; then
                    valid=false
                  fi
                done <<<"$labelers"
                if [ "$valid" = true ]; then
                  approver="$(jq -r --arg label "$APPROVAL_LABEL" '[.[]
                    | select((.name | ascii_downcase) == ($label | ascii_downcase))]
                    | (first // {}) | .login // ""' <<<"$latest")"
                  if [[ "$approver" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*(\[bot\])?$ ]]; then
                    break
                  fi
                fi
                approver=""
                labelers=""
                printf '::warning::attempt %s: a latest approval-label event names no valid actor\n' \
                  "$attempt"
              fi
            else
              printf '::warning::attempt %s: could not read the label events of issue #%s: %s\n' \
                "$attempt" "$ISSUE_NUMBER" "$(head -c 300 "$errors" | tr '\n' ' ')"
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if [ "$removed" = true ]; then
            printf 'authorized=false\napprover=\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Planning not scheduled: an approval label was removed.\n'
            exit 0
          fi
          if [ -z "$approver" ]; then
            printf '::error::Could not determine who applied each of %s to issue #%s; failing instead of authorizing. Re-run this job or re-apply the labels.\n' \
              "$REQUIRED_LABELS" "$ISSUE_NUMBER"
            exit 1
          fi
          # Two times, one per question (Codex 4241327876). The content-staleness check below uses
          # the EARLIEST latest application (`approved_at`): an edit must precede EVERY label.
          # Plan dedupe uses the NEWEST (`approved_latest_at`): a plan covers the approval only
          # if it follows every current label application, so re-applying one label re-plans.
          if ! approved_at="$(jq -er '[.[] | .at | fromdateiso8601] | min' <<<"$latest" 2>"$errors")" ||
            ! approved_latest_at="$(jq -er '[.[] | .at | fromdateiso8601] | max' <<<"$latest" \
              2>"$errors")"; then
            printf '::error::Could not read when each of %s was applied to issue #%s; failing instead of authorizing.\n' \
              "$REQUIRED_LABELS" "$ISSUE_NUMBER"
            exit 1
          fi
          edited=""
          for attempt in 1 2 3; do
            if answer="$(gh api graphql \
              -f query='query($owner: String!, $name: String!, $number: Int!) {
                repository(owner: $owner, name: $name) { issue(number: $number) {
                  lastEditedAt userContentEdits(last: 1) { nodes { editedAt } } } } }' \
              -f owner="${GITHUB_REPOSITORY%%/*}" -f name="${GITHUB_REPOSITORY#*/}" \
              -F number="$ISSUE_NUMBER" 2>"$errors")" &&
              edited="$(jq -er --argjson renamed "$renamed" '
                .data.repository.issue as $issue
                | if (.errors // null) != null or ($issue | type) != "object"
                    or ($issue | has("lastEditedAt") | not)
                    or ($issue.userContentEdits.nodes | type) != "array"
                  then error("no edit times in the answer")
                  else [$renamed, ($issue.lastEditedAt | if . == null then empty
                      else fromdateiso8601 end),
                    ($issue.userContentEdits.nodes[] | .editedAt | fromdateiso8601)] | max
                  end' <<<"$answer" 2>"$errors")"; then
              break
            fi
            edited=""
            printf '::warning::attempt %s: could not read when issue #%s was last edited: %s\n' \
              "$attempt" "$ISSUE_NUMBER" "$(head -c 300 "$errors" | tr '\n' ' ')"
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if ! [[ "$edited" =~ ^[0-9]+$ && "$approved_at" =~ ^[0-9]+$ ]]; then
            printf '::error::Could not read when issue #%s was last edited; failing instead of authorizing an approval that may not cover its current content. Re-run this job.\n' \
              "$ISSUE_NUMBER"
            exit 1
          fi
          if [ "$edited" -ge "$approved_at" ]; then
            printf 'authorized=false\napprover=\n' >> "$GITHUB_OUTPUT"
            printf '::notice::Planning not scheduled: issue #%s was edited after its approval labels were applied. A maintainer must review the current title and body and re-apply (remove and add) each of %s.\n' \
              "$ISSUE_NUMBER" "$REQUIRED_LABELS"
            exit 0
          fi
          mapfile -t logins <<<"$labelers"
          for login in "$SENDER" "$ACTOR" "${logins[@]}"; do
            encoded="$(jq -rn --arg login "$login" '$login | @uri')"
            permission=""
            for attempt in 1 2 3; do
              if body="$(gh api --method GET \
                "repos/${GITHUB_REPOSITORY}/collaborators/${encoded}/permission" 2>"$errors")"; then
                permission="$(jq -r '.permission // empty | strings' <<<"$body" 2>/dev/null || true)"
                if [ -n "$permission" ]; then
                  break
                fi
                printf '::warning::attempt %s: no permission field in the answer for %s\n' "$attempt" "$login"
              elif grep -q '(HTTP 404)' "$errors"; then
                permission=none
                break
              else
                printf '::warning::attempt %s: could not read the permission of %s: %s\n' \
                  "$attempt" "$login" "$(head -c 300 "$errors" | tr '\n' ' ')"
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep "$((attempt * 10))"
              fi
            done
            if [ -z "$permission" ]; then
              printf '::error::Could not read the repository permission of %s; failing instead of treating the labeler as unauthorized. Re-run this job or re-apply the label.\n' "$login"
              exit 1
            fi
            case "$permission" in
              admin|write) ;;
              *) authorized=false ;;
            esac
          done
          printf 'authorized=%s\napprover=%s\napproved_at=%s\napproved_latest_at=%s\n' \
            "$authorized" "$approver" "$approved_at" "$approved_latest_at" >> "$GITHUB_OUTPUT"
          if [ "$authorized" != true ]; then
            printf '::notice::Planning not scheduled: the labeler lacks repository write authority.\n'
          fi

  # Codex 4239667541: when preflight itself FAILS (the permission could not be read after its
  # retries) or is cancelled, every job after it is skipped and no other notifier fires, so the
  # one-shot label event would be consumed in silence. That is not a definitive "unauthorized"
  # (preflight then SUCCEEDS with authorized=false and nothing is reported): say on the issue
  # that the labeler's authority could not be verified. GitHub-hosted like the authorization
  # itself -- nothing reaches RUNS_ON for an unverified labeler -- with only `issues: write`.
  # Codex 4240628982: removing an approval label cancels the run, so "cancelled" includes that
  # (and Codex 4241196649: so does editing the issue's title or body).
  # Not tunable: doctor requires this job and its runner exactly as generated.
  authorization_failed:
    needs: preflight
    if: >-
      ${{ always() &&
      (needs.preflight.result == 'failure' || needs.preflight.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Report that the labeler's authority could not be verified
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Planning was not started: the labeler's repository write authority could not be verified (the permission check failed or was cancelled -- a run is cancelled when an approval label is removed, or the issue is edited, while it is queued or running; this is not an "unauthorized" answer). Re-run the failed jobs of this run, or remove and re-apply the label. Inspect the run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });

  # Duplicate suppression: no new plan when the platform's plan comment (posted by
  # github-actions[bot], starting "## Agentic SDLC plan") is newer than the latest application of
  # EVERY planning label (the newest of them, `approved_latest_at`) -- a plan already covers this
  # approval. Re-applying a label (after a
  # cancellation, an edit or a failure) makes the approval newer than any plan, so it plans
  # again. Comments that cannot be read FAIL the job (reported by notify_failure), never plan
  # twice in silence. Not tunable: GitHub-hosted, read-only.
  dedupe:
    needs: preflight
    if: needs.preflight.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: read
    outputs:
      fresh: ${{ steps.dedupe.outputs.fresh }}
    steps:
      - name: Skip planning when a plan already covers the current approval
        id: dedupe
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          # The NEWEST latest application of the planning labels (Codex 4241327876): re-applying
          # just one label must outdate an earlier plan.
          APPROVED_AT: ${{ needs.preflight.outputs.approved_latest_at }}
        run: |
          set -euo pipefail
          if ! [[ "$APPROVED_AT" =~ ^[0-9]+$ ]]; then
            printf '::error::The approval time of issue #%s is unknown; not planning.\n' "$ISSUE_NUMBER"
            exit 1
          fi
          errors="$(mktemp)"
          planned=""
          for attempt in 1 2 3; do
            if planned="$(gh api --method GET --paginate \
              "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments?per_page=100" \
              --jq '.[] | select(.user.login == "github-actions[bot]"
                and ((.body // "") | startswith("## Agentic SDLC plan")))
                | .created_at | fromdateiso8601' 2>"$errors")"; then
              break
            fi
            planned="unreadable"
            printf '::warning::attempt %s: could not read the comments of issue #%s: %s\n' \
              "$attempt" "$ISSUE_NUMBER" "$(head -c 300 "$errors" | tr '\n' ' ')"
            if [ "$attempt" -lt 3 ]; then
              sleep "$((attempt * 10))"
            fi
          done
          if [ "$planned" = unreadable ]; then
            printf '::error::Could not read the comments of issue #%s; not planning.\n' "$ISSUE_NUMBER"
            exit 1
          fi
          fresh=true
          while IFS= read -r at; do
            if [ -n "$at" ] && [ "$at" -gt "$APPROVED_AT" ]; then
              fresh=false
            fi
          done <<<"$planned"
          printf 'fresh=%s\n' "$fresh" >> "$GITHUB_OUTPUT"
          if [ "$fresh" != true ]; then
            printf '::notice::A plan was already posted for the current approval of issue #%s; not planning again.\n' "$ISSUE_NUMBER"
          fi

  plan:
    needs: [preflight, dedupe]
    if: needs.preflight.outputs.authorized == 'true' && needs.dedupe.outputs.fresh == 'true'
    permissions:
      contents: read
      issues: write
      id-token: write
    uses: "atulg4/agentic-sdlc/.github/workflows/reusable-plan.yml@02ce92be893484415d9f96f4abb75d3724cb7831"
    with:
      runs_on: "[\"ubuntu-latest\"]"
      issue_number: ${{ format('{0}', github.event.issue.number) }}
      trigger_actor: ${{ needs.preflight.outputs.approver }}
      config_path: agentic-sdlc.toml
      platform_ref: "02ce92be893484415d9f96f4abb75d3724cb7831"
      platform_repository: "atulg4/agentic-sdlc"
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}

  notify_failure:
    needs: [dedupe, plan]
    if: >-
      ${{ always() &&
      (needs.dedupe.result == 'failure' || needs.dedupe.result == 'cancelled' ||
      needs.plan.result == 'failure' || needs.plan.result == 'cancelled') }}
    runs-on: ["ubuntu-latest"]
    permissions:
      issues: write
    steps:
      - name: Report planning failure
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: Number(process.env.ISSUE_NUMBER),
              body: `Agent planning did not complete. Inspect the bounded run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
