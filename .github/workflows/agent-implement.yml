name: Agent implementation

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: Approved GitHub issue number
        required: true
        type: string
      agent:
        description: Patch generator
        required: true
        default: claude
        type: choice
        options: [claude, codex]

permissions: {}

jobs:
  implement:
    permissions:
      contents: write
      issues: read
      pull-requests: read
    uses: ./.github/workflows/forge-compat-implement.yml
    with:
      runs_on: '"constellation-runners"'
      issue_number: ${{ inputs.issue_number }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: 2213ee45859eaea46a177fd3cdbafe812901b205
      platform_repository: atulg4/agentic-sdlc
      publisher_app_client_id: ${{ vars.PUBLISHER_APP_CLIENT_ID }}
      agent: ${{ inputs.agent }}
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
      PUBLISHER_APP_PRIVATE_KEY: ${{ secrets.PUBLISHER_APP_PRIVATE_KEY }}
