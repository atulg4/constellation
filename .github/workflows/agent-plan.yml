name: Agent plan

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: GitHub issue number
        required: true
        type: string

permissions: {}

jobs:
  plan:
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/forge-compat-plan.yml
    with:
      runs_on: '"constellation-runners"'
      issue_number: ${{ inputs.issue_number }}
      trigger_actor: ${{ github.actor }}
      config_path: agentic-sdlc.toml
      platform_ref: 2213ee45859eaea46a177fd3cdbafe812901b205
      platform_repository: atulg4/agentic-sdlc
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PLATFORM_READ_TOKEN: ${{ secrets.PLATFORM_READ_TOKEN }}
